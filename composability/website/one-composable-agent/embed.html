<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />
  <title>Why not one?</title>
  <style>
    body {
      margin: 0;
      background: white;
    }
    video,
    img {
      display: block;
      width: 100%;
      height: auto;
    }
    img {
      display: none;
    }
    @media (prefers-reduced-motion: reduce) {
      video {
        display: none;
      }
      img {
        display: block;
      }
    }
  </style>
  <video
    autoplay
    loop
    muted
    playsinline
    preload="metadata"
    width="1440"
    height="280"
    poster="output/poster.png"
    aria-label="Many possibilities resolve into one composable agent."
  >
    <source src="output/loop.webm" type="video/webm" />
    <source src="output/loop.mp4" type="video/mp4" />
  </video>
  <img
    src="output/poster.png"
    width="1440"
    height="280"
    alt="Many possibilities resolve into one composable agent."
  />
  <script>
    const video = document.querySelector("video"),
      preference = matchMedia("(prefers-reduced-motion:reduce)");
    function update() {
      if (preference.matches) video.pause();
      else
        video.play().catch(() => {
          video.controls = true;
        });
    }
    preference.addEventListener("change", update);
    update();
  </script>
</html>
