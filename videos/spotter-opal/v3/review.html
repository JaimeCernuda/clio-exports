<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPOTTER · Three-step investigation</title><style>
body{margin:0;background:#eff6f9;color:#153e51;font:14px system-ui,sans-serif}main{max-width:1540px;margin:auto;padding:20px}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:21px;margin:0 auto 0 0}a,button,select{font:inherit;color:inherit}a{text-decoration:none;border-bottom:1px solid #9cb4bf}video{width:100%;max-height:82vh;background:#101d25;display:block;margin:18px 0 12px;border-radius:8px}button,select{border:1px solid #bbced6;border-radius:5px;padding:6px 10px;background:#fff;cursor:pointer}.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}small{color:#5e7c8a}#hash{font-family:monospace;font-size:11px;overflow-wrap:anywhere}p{line-height:1.5}
</style><main><header><h1>SPOTTER · Follow the evidence</h1><select id="cut" aria-label="Video version"><option value="full">Complete film</option><option value="proof">Internal moving proof</option></select><a href="http://127.0.0.1:3372/?demo=demos/spotter-current.json">Editable replay</a><a id="download" download>Download MP4</a></header><video id="video" controls playsinline preload="metadata"></video><div class="bar"><button id="back">← Frame</button><button id="play">Play / Pause</button><button id="next">Frame →</button><select id="shots" aria-label="Shot markers"><option value="">Shot markers</option></select><span id="time"></span></div><p><small id="description"></small></p><p id="hash"></p></main><script>
const video=document.querySelector('#video'),cut=document.querySelector('#cut'),shots=document.querySelector('#shots');
async function load(){const name=`spotter-three-steps-${cut.value}.mp4`;video.src='/'+name;document.querySelector('#download').href='/'+name;const response=await fetch('/'+name+'.json');if(!response.ok){document.querySelector('#description').textContent='This render is not available yet.';return;}const data=await response.json();document.querySelector('#hash').textContent='SHA256 '+data.sha256;document.querySelector('#description').textContent=cut.value==='full'?'Three displayed steps, reconstructed source lookup views, recorded SPOTTER investigation and word attention. Additional original rounds are omitted.':'Discontinuous internal proof: tool arrival, collapse, selection, native toolbar and attention scrolling. This is not the finished story.';shots.replaceChildren(new Option('Shot markers',''));for(const [seconds,label] of data.markers??[])shots.add(new Option(`${seconds.toFixed(1)}s · ${label}`,seconds));}
cut.value=new URLSearchParams(location.search).get('clip')==='proof'?'proof':'full';cut.onchange=load;shots.onchange=()=>{video.pause();video.currentTime=Number(shots.value);};document.querySelector('#play').onclick=()=>video.paused?video.play():video.pause();function step(delta){video.pause();video.currentTime=Math.max(0,Math.min(video.duration||0,video.currentTime+delta/60));}document.querySelector('#back').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();step(1);}if(e.key==='ArrowLeft'){e.preventDefault();step(-1);}});video.ontimeupdate=()=>document.querySelector('#time').textContent=`${video.currentTime.toFixed(2)} / ${(video.duration||0).toFixed(2)} s`;load();
</script></html>
