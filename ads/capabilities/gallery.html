<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLIO capability films</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6fafb;color:#173b4c;font-family:Inter,system-ui,sans-serif}header{display:flex;align-items:center;gap:15px;padding:26px 5vw;border-bottom:1px solid #d5e3e8}header img{width:40px}h1{font-size:23px;margin:0}header span{color:#66818a;margin-left:auto;font-size:14px}main{max-width:1450px;margin:30px auto;padding:0 25px}video{width:100%;aspect-ratio:16/9;background:#fff;border-radius:16px;border:1px solid #d5e3e8}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}button,a.download{font:inherit;border:1px solid #bed2dc;background:white;color:#173b4c;padding:9px 15px;border-radius:9px;cursor:pointer;text-decoration:none}button:hover{background:#e4f2f6}.time{font-variant-numeric:tabular-nums;margin-left:auto}.markers{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 27px}.markers button{font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{padding:0;overflow:hidden;text-align:left;border-radius:14px;background:white;border:1px solid #d5e3e8}.card.active{box-shadow:0 0 0 2px #3185a1}.card img{width:100%;aspect-ratio:16/9;object-fit:cover}.card div{padding:14px;font-size:15px;line-height:1.5}.card small{display:block;color:#66818a}.subtitle{color:#66818a}footer{padding:30px 0;color:#66818a;font-size:13px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}header span{display:none}}</style></head>
<body><header><img src="public/clio-mark.svg" alt=""><h1>CLIO capability films</h1><span>Eight independent motion ads</span></header><main><h2 id="title">Loading films…</h2><p class="subtitle" id="subtitle"></p><video id="video" controls playsinline preload="metadata"></video><div class="controls"><button id="play">Play / pause</button><button id="back">−1 frame</button><button id="forward">+1 frame</button><button id="speed">0.5×</button><button id="normal">1×</button><a class="download" id="download">Download MP4</a><span class="time" id="time">00:00.00</span></div><div id="markers" class="markers"></div><div id="grid" class="grid"></div><footer>Space: play/pause. Left/right: one second. Comma/period: one frame. Movies include sound and on-screen copy.</footer></main>
<script type="module">
const manifest=await(await fetch('output/manifest.json')).json();const byId=new Map();for(const f of manifest){const p=byId.get(f.id);if(!p||f.width>p.width)byId.set(f.id,f);}const films=[...byId.values()].sort((a,b)=>a.number-b.number);const video=document.querySelector('#video'),time=document.querySelector('#time');let selected;
function select(f){selected=f;video.src='output/'+f.filename;video.poster='output/'+f.poster;document.querySelector('#title').textContent=f.number+'. '+f.title;document.querySelector('#subtitle').textContent=f.domain+' / '+f.seconds+' seconds / '+f.width+' × '+f.height+' / 60 fps';document.querySelector('#download').href='output/'+f.filename+'?download=1';document.querySelector('#download').download=f.filename;document.querySelector('#markers').replaceChildren(...f.markers.map(m=>{const b=document.createElement('button');b.textContent=m.at+'s '+m.label;b.onclick=()=>{video.currentTime=m.at;video.pause()};return b}));document.querySelectorAll('.card').forEach(c=>c.classList.toggle('active',c.dataset.id===f.id));history.replaceState(null,'','?film='+f.id);}
for(const f of films){const b=document.createElement('button');b.className='card';b.dataset.id=f.id;const img=document.createElement('img');img.src='output/'+f.poster;img.alt='';const d=document.createElement('div');d.textContent=f.number+'. '+f.title;const s=document.createElement('small');s.textContent=f.domain+' · '+f.seconds+'s';d.append(s);b.append(img,d);b.onclick=()=>select(f);document.querySelector('#grid').append(b);}
const step=n=>{video.pause();video.currentTime=Math.max(0,Math.min(video.duration||0,video.currentTime+n/60));};document.querySelector('#play').onclick=()=>video.paused?video.play():video.pause();document.querySelector('#back').onclick=()=>step(-1);document.querySelector('#forward').onclick=()=>step(1);document.querySelector('#speed').onclick=()=>video.playbackRate=.5;document.querySelector('#normal').onclick=()=>video.playbackRate=1;video.ontimeupdate=()=>time.textContent=video.currentTime.toFixed(2)+' / '+(video.duration||selected.seconds).toFixed(2);document.onkeydown=e=>{if(e.target.tagName==='BUTTON')return;if(e.key===' '){e.preventDefault();video.paused?video.play():video.pause()}if(e.key===',')step(-1);if(e.key==='.')step(1);if(e.key==='ArrowLeft')step(-60);if(e.key==='ArrowRight')step(60);};if(films.length)select(films.find(f=>f.id===new URLSearchParams(location.search).get('film'))??films[0]);else document.querySelector('#title').textContent='The campaign has not been rendered yet.';
</script></body></html>
