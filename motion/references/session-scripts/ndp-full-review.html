<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>NDP + CLIO · Full film</title>
<style>
html,body{margin:0;height:100%;background:#f5f5f1;color:#183442;font:14px system-ui}
main{height:100%;display:flex;flex-direction:column}
video{width:100%;height:calc(100vh - 54px);object-fit:contain}
footer{display:flex;gap:12px;align-items:center;height:54px;padding:0 16px}
button,select{background:white;border:1px solid #cbdce2;border-radius:5px;padding:6px 12px;color:inherit}
input{flex:1;min-width:80px}output{font-variant-numeric:tabular-nums;min-width:110px}
</style>
<main>
<video aria-label="NDP and CLIO campaign" controls playsinline muted preload="metadata"></video>
<footer>
<select aria-label="Campaign">
<option value="ndp-clio-connected-v1.mp4">Full film · 5:36</option>
<option value="ndp-clio-tahoe-v4.mp4">Tahoe · 1:42</option>
<option value="ndp-clio-alta-v2.mp4">Alta · 1:55</option>
<option value="ndp-clio-konza-v2.mp4">Konza · 1:57</option>
</select>
<button id="restart">Play from beginning</button>
<button id="pause">Pause</button>
<input aria-label="Seek video seconds" type="range" min="0" max="336.6" step="0.1">
<output>0 / 336.6</output>
</footer>
</main>
<script>
const v=document.querySelector('video'),s=document.querySelector('input'),o=document.querySelector('output'),c=document.querySelector('select');
const q=new URLSearchParams(location.search).get('clip');
if([...c.options].some(a=>a.value===q))c.value=q;
v.src=c.value;
c.onchange=()=>{v.src=c.value;v.load()};
document.querySelector('#restart').onclick=()=>{v.currentTime=0;v.play()};
document.querySelector('#pause').onclick=()=>v.pause();
s.oninput=()=>{v.pause();v.currentTime=Number(s.value)};
v.onloadedmetadata=()=>{s.max=v.duration};
v.ontimeupdate=()=>{s.value=v.currentTime;o.textContent=v.currentTime.toFixed(1)+' / '+v.duration.toFixed(1)+(v.ended?' · ended':'')};
</script>
</html>
