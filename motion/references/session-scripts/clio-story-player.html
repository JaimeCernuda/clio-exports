<!doctype html><html lang="en"><meta charset="utf-8"><title>CLIO — Follow the investigation</title><style>html,body{margin:0;height:100%;background:#f5f5f1;font:14px system-ui;color:#254257}main{height:100%;display:flex;flex-direction:column}video{display:block;width:100%;height:calc(100vh - 48px);object-fit:contain}footer{height:48px;display:flex;align-items:center;gap:14px;padding:0 16px}button{padding:6px 14px;border:1px solid #cfd9db;border-radius:5px;background:white;color:inherit}output{font-size:12px;font-variant-numeric:tabular-nums}</style><main><video aria-label="CLIO investigation film" src="/clio-investigation-story.mp4" poster="/clio-investigation-story-poster.png" controls playsinline muted preload="metadata"></video><footer><button type="button" id="play">Play from beginning</button><output id="progress">0:00 / 1:48</output></footer></main><script>const v=document.querySelector('video');document.querySelector('#play').onclick=()=>{v.currentTime=0;v.play()};v.ontimeupdate=()=>{const s=Math.floor(v.currentTime);document.querySelector('#progress').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+' / 1:48'+(v.ended?' · ended':'')};</script></html>
