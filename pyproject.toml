[project]
name = "clio-exports-motion"
version = "0.1.0"
description = "Source-linked session selection for editable CLIO product films"
requires-python = ">=3.11"
dependencies = ["ijson>=3.4,<4"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11",
    "pyright>=1.1.400",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["tools", "tests"]
extraPaths = ["tools"]
